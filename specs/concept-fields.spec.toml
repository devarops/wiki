#:schema https://raw.githubusercontent.com/tskovlund/qed/main/docs/spec.schema.json

name = "concept-fields"

# Concept document field validation beyond presence checks.
# Covers word count limits (§3b) and field type correctness (§6).

[[criteria]]
description = """
Title field must be 8 words or shorter. A title exceeding 8 words
is an error.
"""

[criteria.verify]
type = "command"
run = "pytest tests/ -k 'title_word_count or title_length'"

[[criteria]]
description = """
Description field must be 16 words or shorter. A description exceeding
16 words is an error.
"""

[criteria.verify]
type = "command"
run = "pytest tests/ -k 'description_word_count or description_length'"

[[criteria]]
description = """
Frontmatter type field must be a non-empty string. A value that is
not a string (e.g. type: 42) is an error.
"""

[criteria.verify]
type = "command"
run = "pytest tests/ -k 'type_string or type_non_string'"

